
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Interés Simple</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eef2f7;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .contenedor {
            background: white;
            padding: 30px;
            border-radius: 15px;
            width: 350px;
            box-shadow: 0 5px 20px #0002;
        }

        h1 {
            text-align: center;
            color: #174ea6;
        }

        p {
            text-align: center;
            color: #555;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 7px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            background: #174ea6;
            color: white;
            border: none;
            border-radius: 7px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #0d3575;
        }

        .resultado {
            margin-top: 20px;
            padding: 15px;
            background: #e8f0fe;
            border-radius: 8px;
            display: none;
        }

        .resultado h3 {
            color: #174ea6;
        }
    </style>
</head>

<body>

    <div class="contenedor">

        <h1>Calculadora de Interés Simple</h1>

        <p>Calcula cuánto puedes ganar con tu inversión.</p>

        <label>Capital inicial ($)</label>
        <input type="number" id="capital" placeholder="Ej: 1000000" min="0">

        <label>Tasa de interés (%)</label>
        <input type="number" id="tasa" placeholder="Ej: 5" min="0" step="any">

        <label>Tiempo</label>
        <input type="number" id="tiempo" placeholder="Ej: 12" min="0" step="any">

        <label>Unidad de tiempo</label>
        <select id="unidad">
            <option value="12">Meses</option>
            <option value="1">Años</option>
        </select>

        <button onclick="calcularInteres()">Calcular interés</button>

        <div class="resultado" id="resultado">
            <h3>Resultados</h3>
            <p id="interes"></p>
            <p id="total"></p>
        </div>

    </div>

    <script>
        function calcularInteres() {

            let capital = parseFloat(document.getElementById("capital").value);
            let tasa = parseFloat(document.getElementById("tasa").value);
            let tiempo = parseFloat(document.getElementById("tiempo").value);
            let unidad = parseFloat(document.getElementById("unidad").value);

            if (isNaN(capital) || isNaN(tasa) || isNaN(tiempo) ||
                capital <= 0 || tasa < 0 || tiempo <= 0) {
                alert("Por favor, ingresa valores válidos.");
                return;
            }

            // Convertir el tiempo a años
            let tiempoAnios = tiempo / unidad;

            // Fórmula del interés simple: I = C * i * t
            let interes = capital * (tasa / 100) * tiempoAnios;

            // Calcular el monto total
            let montoTotal = capital + interes;

            document.getElementById("interes").innerHTML =
                "Interés generado: $" + interes.toLocaleString("es-CO");

            document.getElementById("total").innerHTML =
                "Monto total: $" + montoTotal.toLocaleString("es-CO");

            document.getElementById("resultado").style.display = "block";
        }
    </script>

</body>
</html>
